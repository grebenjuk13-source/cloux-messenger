name: Build Cloux for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macos-app/**"
      - "download.html"
      - "main.py"
      - ".github/workflows/cloux-macos.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build universal macOS app and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Cloux.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          swiftc -parse-as-library -O -target arm64-apple-macos13.0 -framework AppKit -framework SwiftUI -framework WebKit macos-app/ClouxApp.swift -o "$RUNNER_TEMP/Cloux-arm64"
          swiftc -parse-as-library -O -target x86_64-apple-macos13.0 -framework AppKit -framework SwiftUI -framework WebKit macos-app/ClouxApp.swift -o "$RUNNER_TEMP/Cloux-x86_64"
          lipo -create "$RUNNER_TEMP/Cloux-arm64" "$RUNNER_TEMP/Cloux-x86_64" -output "$APP/Contents/MacOS/Cloux"

          mkdir -p "$RUNNER_TEMP/Cloux.iconset"
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" assets/cloux-official-512.jpg --out "$RUNNER_TEMP/Cloux.iconset/icon_${size}x${size}.png" >/dev/null
          done
          sips -s format png -z 32 32 assets/cloux-official-512.jpg --out "$RUNNER_TEMP/Cloux.iconset/icon_16x16@2x.png" >/dev/null
          sips -s format png -z 64 64 assets/cloux-official-512.jpg --out "$RUNNER_TEMP/Cloux.iconset/icon_32x32@2x.png" >/dev/null
          sips -s format png -z 256 256 assets/cloux-official-512.jpg --out "$RUNNER_TEMP/Cloux.iconset/icon_128x128@2x.png" >/dev/null
          sips -s format png -z 512 512 assets/cloux-official-512.jpg --out "$RUNNER_TEMP/Cloux.iconset/icon_256x256@2x.png" >/dev/null
          sips -s format png -z 1024 1024 assets/cloux-official-512.jpg --out "$RUNNER_TEMP/Cloux.iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$RUNNER_TEMP/Cloux.iconset" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Cloux</string>
            <key>CFBundleIdentifier</key><string>com.cloux.messenger.mac</string>
            <key>CFBundleName</key><string>Cloux</string>
            <key>CFBundleDisplayName</key><string>Cloux Messenger</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>6.6.0</string>
            <key>CFBundleVersion</key><string>650</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Cloux використовує мікрофон для голосових дзвінків.</string>
            <key>NSCameraUsageDescription</key><string>Cloux використовує камеру для відеодзвінків.</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.social-networking</string>
          </dict></plist>
          PLIST

          mkdir -p "$RUNNER_TEMP/dmg-stage"
          cp -R "$APP" "$RUNNER_TEMP/dmg-stage/"
          ln -s /Applications "$RUNNER_TEMP/dmg-stage/Applications"
          hdiutil create -volname "Cloux" -srcfolder "$RUNNER_TEMP/dmg-stage" -ov -format UDZO "$RUNNER_TEMP/Cloux-macOS.dmg"
          cp "$RUNNER_TEMP/Cloux-macOS.dmg" "$GITHUB_WORKSPACE/Cloux-macOS.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloux-macOS-DMG
          path: Cloux-macOS.dmg
          retention-days: 90

      - name: Publish stable DMG download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="CLOUX 6.6.0. Універсальний DMG для Mac з Apple silicon та Intel.

          Ця збірка не підписана Apple Developer ID і не нотаризована. Після завантаження macOS може попросити відкрити застосунок через контекстне меню."
          if gh release view cloux-macos >/dev/null 2>&1; then
            gh release upload cloux-macos Cloux-macOS.dmg --clobber
            gh release edit cloux-macos --title "Cloux для Mac · 6.6.0" --notes "$NOTES"
          else
            gh release create cloux-macos Cloux-macOS.dmg --title "Cloux для Mac · 6.6.0" --notes "$NOTES"
          fi
