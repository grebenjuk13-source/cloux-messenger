name: Cloux social and localization smoke
on:
  push:
    branches: [main]
    paths:
      - 'cloux_experience.py'
      - 'cloux_product.py'
      - 'cloux_social.py'
      - 'main.py'
      - 'tests/test_experience.py'
      - 'tests/test_product.py'
      - '.github/workflows/cloux-experience.yml'
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx pytest
      - run: PYTHONPATH=. pytest -q tests/test_experience.py tests/test_product.py
