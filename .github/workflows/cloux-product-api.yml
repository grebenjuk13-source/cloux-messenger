name: CLOUX Product API smoke
on:
  push:
    branches: [main]
    paths:
      - 'cloux_product.py'
      - 'cloux_identity.py'
      - 'tests/test_identity.py'
      - 'main.py'
      - 'Dockerfile'
      - 'tests/test_product.py'
      - '.github/workflows/cloux-product-api.yml'
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx pytest
      - run: PYTHONPATH=. pytest -q tests/test_product.py tests/test_identity.py
