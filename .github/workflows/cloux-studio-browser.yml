name: CLOUX Studio browser tests
on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'download.html'
      - 'tests/studio_ui_test.mjs'
      - 'tests/studio_call_test.mjs'
      - '.github/workflows/cloux-studio-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve local project
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > studio-server.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/studio/ >/dev/null; then break; fi; sleep 1; done
      - name: Browser smoke
        run: node tests/studio_ui_test.mjs
      - name: Actual WebRTC peer test
        run: node tests/studio_call_test.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloux-studio-browser-screenshots
          path: |
            cloux-studio-*.png
            cloux-download-mobile.png
            studio-server.log
