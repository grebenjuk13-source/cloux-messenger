name: Build Cloux Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/cloux-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        run: gradle -p android-app --no-daemon --stacktrace assembleDebug
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloux-Android-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Update direct APK download
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Cloux-Android-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Cloux-Android-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Cloux Android debug APK [skip ci]"
            git push
          fi
