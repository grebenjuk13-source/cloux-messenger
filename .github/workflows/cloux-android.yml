name: Build Cloux Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/cloux-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install official Cloux icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          cp assets/cloux-official-512.jpg android-app/app/src/main/res/drawable-nodpi/cloux_official.jpg
      - name: Build APK
        run: gradle -p android-app --no-daemon --stacktrace assembleDebug
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloux-Android-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish current Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Cloux-Android.apk
          FILE="Cloux-Android.apk"
          if gh release view cloux-android >/dev/null 2>&1; then
            gh release upload cloux-android "$FILE" --clobber
            gh release delete-asset cloux-android app-debug.apk --yes || true
            gh release edit cloux-android --title "Cloux Android 6.5.0" --notes "Cloux 6.5.0 для Android 8+. Наявна збірка APK — debug, для тестування. При оновленні Android може вимагати видалити стару APK, якщо сертифікати збірок відрізняються. Повноцінне безперервне оновлення потребує постійного ключа підпису."
          else
            gh release create cloux-android "$FILE" --title "Cloux Android 6.5.0" --notes "Cloux 6.5.0 для Android 8+. Тестова debug APK; підписані збірки потребують постійного приватного ключа."
          fi
      - name: Update direct APK download
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Cloux-Android-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Cloux-Android-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Cloux Android debug APK [skip ci]"
            git pull --rebase
            git push
          fi
