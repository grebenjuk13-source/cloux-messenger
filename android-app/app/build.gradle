plugins {
    id 'com.android.application'
}
android {
    namespace 'com.cloux.messenger'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cloux.messenger'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
